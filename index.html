<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <!-- viewport: sivu skaalautuu oikein puhelimella -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vetovihje</title>
  <link rel="stylesheet" href="tyyli.css?v=8">
</head>
<body>
  <h1>Vetovihje</h1>

  <!-- Välilehdet: #pelaajat osoitteen lopussa avaa Pelaajavedot suoraan -->
  <nav class="valilehdet">
    <a href="#vedot" id="valilehti-vedot" class="valilehti aktiivinen">Vedot</a>
    <a href="#pelaajat" id="valilehti-pelaajat" class="valilehti">Pelaajavedot</a>
  </nav>

  <!-- Vedot-välilehti (entinen sivu sellaisenaan) -->
  <div id="nakyma-vedot">
    <!-- Nämä ovat tyhjiä "laatikoita", jotka JavaScript täyttää -->
    <section id="yhteenveto"></section>
    <section id="erittely"></section>
    <section id="clv"></section>
    <section id="paivat">Ladataan...</section>
  </div>

  <!-- Pelaajavedot-välilehti, pelaajat.js täyttää -->
  <div id="nakyma-pelaajat" hidden>
    <div class="pelaaja-ylapalkki">
      <div id="pelaaja-otsikko"></div>
      <button type="button" id="asetukset-nappi" class="pieni-nappi">Asetukset</button>
    </div>
    <section id="pelaaja-asetukset" class="erittely-kortti" hidden></section>
    <section id="pelaaja-suodattimet"></section>
    <section id="pelaaja-ottelut">Ladataan...</section>
    <section id="pelaaja-saldo"></section>
    <section id="pelaaja-kalibraatio"></section>
  </div>

  <script src="sovellus.js?v=7"></script>
  <script src="pelaajat.js?v=3"></script>
</body>
</html>
