name: Vetovihje

on:
  schedule:
    # Aika UTC-aikana. Talviaikana (Suomi = UTC+2): 13:37 = 15.37 ja 20:37 = 22.37
    - cron: "37 13 * * *"
    - cron: "37 20 * * *"
  # Lisää "Run workflow" -napin, jolla ajon voi käynnistää käsin
  workflow_dispatch:

# Lupa tallentaa muutokset takaisin repoon
permissions:
  contents: write

# Tämä ja pelaajaennusteet.yml ajetaan vuorotellen, etteivät niiden commitit törmää
concurrency:
  group: vetovihje-repo
  cancel-in-progress: false

jobs:
  aja:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Helsinki
    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna kirjastot
        run: pip install -r requirements.txt

      - name: Tarkista tulokset
        run: python tarkista_tulokset.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Hae kertoimet
        run: python hae_kertoimet.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Hakee uusista peleistä sekä aloittavat maalivahdit että pelaajien tehopisteet
      - name: Päivitä maalivahdit ja pelaajadata
        run: python hae_maalivahdit.py

      - name: Päivitä Poisson-malli
        run: python poisson_malli.py

      # Pelaajamallin virhe ei saa estää ottelukertoimien vetoja eikä kirjanpidon tallennusta
      - name: Pelaajaennusteet
        run: python pelaajamalli.py
        continue-on-error: true

      - name: Laske value ja kirjaa vedot
        run: python laske_value.py

      - name: Tallenna kirjanpito GitHubiin
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # Lisätään vain olemassa olevat tiedostot: puuttuva tiedosto kaataisi koko git addin
          for f in kirjanpito.json varjo.json liiga_maalivahdit.json liiga_pelaajat.json pelaajaennusteet.json pelaajavarjo.json pelaajavedot_tulokset.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Automaattinen päivitys" || echo "Ei muutoksia"
          # Sivu tallentaa pelaajavedot.json-tiedostoa suoraan GitHubiin, joten ajon aikana
          # repoon on voinut tulla uusi commit. Haetaan se ensin, ettei push hylätä.
          # --autostash: poisson.json muuttuu ajossa, mutta sitä ei tallenneta
          git pull --rebase --autostash
          git push